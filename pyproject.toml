[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doxnet"
version = "2.0.0"
description = "A lightweight Doxygen-style documentation generator for Verilog and SystemVerilog."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Philip Mohr" }]
requires-python = ">=3.8"
dependencies = [
    "Markdown>=3.4",
    "Pygments>=2.14",
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]

[project.urls]
Homepage = "https://github.com/BTFLV/DoxNet"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
doxnet = "doxnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
