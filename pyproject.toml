[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doxnet"
version = "2.1.0"
description = "HDL-aware documentation and interface validation for Verilog/SystemVerilog."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Philip Mohr" }]
requires-python = ">=3.9"
dependencies = [
    "Markdown>=3.4",
    "Pygments>=2.14",
    "bleach>=5.0",
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]

[project.urls]
Homepage = "https://github.com/BTFLV/DoxNet"
Issues = "https://github.com/BTFLV/DoxNet/issues"

[project.optional-dependencies]
test = ["pytest>=7", "ruff>=0.8"]

[project.scripts]
doxnet = "doxnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
