name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
        include:
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: python -m pytest -q
      - name: Legacy entry point
        run: python DoxNet.py --version

  example-docs:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/python -m pip install dist/doxnet-*.whl
      - name: Generate example documentation with all gates enabled
        run: >-
          /tmp/wheel-env/bin/doxnet --config examples/doxnet.json
          --output dist/example-docs --no-pdf --diagnostics-format github
      - uses: actions/upload-artifact@v4
        with:
          name: example-docs
          path: dist/example-docs/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the repository's own action
        uses: ./
        with:
          args: --config examples/doxnet.json --check
