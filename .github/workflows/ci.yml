name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install DoxNet and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Lint
        run: ruff check src tests
      - name: Run tests
        run: python -m pytest -q
      - name: CLI smoke test
        run: doxnet --version

  example-docs:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Generate example docs with interface coverage gates
        run: >-
          doxnet --input examples/rtl --output dist/example-docs
          --title 'DoxNet Example' --no-pdf --strict
          --min-port-coverage 100 --min-parameter-coverage 100
      - uses: actions/upload-artifact@v4
        with:
          name: example-docs
          path: dist/example-docs/
          if-no-files-found: error
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Install built wheel into a fresh environment
        run: |
          python -m venv wheel-smoke-env
          wheel-smoke-env/bin/python -m pip install dist/doxnet-*.whl
          wheel-smoke-env/bin/doxnet --version
          wheel-smoke-env/bin/doxnet -i examples/rtl -o dist/wheel-example --no-pdf --strict
