<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" width="560" height="140" role="img" aria-label="DoxNet logo">
  <defs>
    <linearGradient id="dn-accent-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79c0ff"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>
  <g transform="translate(10,10)">
    <rect x="0" y="0" width="120" height="120" rx="22" fill="#161b22" stroke="url(#dn-accent-dark)" stroke-width="3"/>
    <!-- chip pins -->
    <g stroke="url(#dn-accent-dark)" stroke-width="4" stroke-linecap="round">
      <line x1="26" y1="0" x2="26" y2="-10"/>
      <line x1="60" y1="0" x2="60" y2="-10"/>
      <line x1="94" y1="0" x2="94" y2="-10"/>
      <line x1="26" y1="120" x2="26" y2="130"/>
      <line x1="60" y1="120" x2="60" y2="130"/>
      <line x1="94" y1="120" x2="94" y2="130"/>
      <line x1="0" y1="26" x2="-10" y2="26"/>
      <line x1="0" y1="60" x2="-10" y2="60"/>
      <line x1="0" y1="94" x2="-10" y2="94"/>
      <line x1="120" y1="26" x2="130" y2="26"/>
      <line x1="120" y1="60" x2="130" y2="60"/>
      <line x1="120" y1="94" x2="130" y2="94"/>
    </g>
    <!-- waveform -->
    <path d="M22 82 L22 60 L42 60 L42 40 L62 40 L62 76 L82 76 L82 52 L98 52"
          fill="none" stroke="url(#dn-accent-dark)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- folded doc corner -->
    <path d="M78 18 L96 18 L96 36 Z" fill="url(#dn-accent-dark)" opacity="0.85"/>
  </g>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700">
    <text x="150" y="80" font-size="52" fill="#e6edf3">Dox<tspan fill="#58a6ff">Net</tspan></text>
    <text x="152" y="104" font-size="16" font-weight="500" fill="#8b949e">Verilog &amp; SystemVerilog documentation generator</text>
  </g>
</svg>
